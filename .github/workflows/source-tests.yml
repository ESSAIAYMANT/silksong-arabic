name: Source regression tests

on:
  push:
    branches: [main]
    paths:
      - 'installer/src/**'
      - 'test-source.ps1'
      - '.github/workflows/source-tests.yml'
  pull_request:
    paths:
      - 'installer/src/**'
      - 'test-source.ps1'
      - '.github/workflows/source-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-engine:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compile and run 45 synthetic installer tests
        shell: pwsh
        run: ./test-source.ps1
